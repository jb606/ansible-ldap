---


- name: Adding service accounts to ldap
  community.general.ldap_entry:
    dn: "cn={{ item.user }},ou=serviceaccounts,{{ base_dn }}"
    objectClass:
      - top
      - organizationalRole
      - simpleSecurityObject

    attributes:
      cn: "{{ item.user }}"
      userPassword: "{{ item.password }}"
    server_uri: "{{ ldap_server }}"
    bind_dn: "{{ admin_dn }}"
    bind_pw: "{{ admin_pw }}"
    state: present
  loop: "{{ service_accounts }}"
  no_log: true