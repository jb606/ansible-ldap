- name: Link users to the default password policy
      # Points each user at cn=Default policy which enforces: pwdMustChange, lockout
      # after 5 failures, 15-min lockout, 5-password history, and quality checking.
      community.general.ldap_attrs:
        dn: "uid={{ item.user_name }},ou=People,{{ base_dn }}"
        attributes:
          pwdPolicySubentry: "cn=Default,ou=Password,ou=Policies,{{ base_dn }}"
          pwdReset: "TRUE"
        state: present
        server_uri: "{{ ldap_server }}"
        bind_dn: "{{ admin_dn }}"
        bind_pw: "{{ admin_pw }}"
      loop: "{{ var_approved_users }}"
      when: item.enabled | default(true)